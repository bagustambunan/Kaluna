<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f4f8ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1727" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Pencatat pengeluaran harian" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kaluna" />
    <title>Kaluna</title>
    <script>
      try {
        const s = JSON.parse(localStorage.getItem('kaluna_settings') || '{}')
        const m = s.darkMode
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const isDark = m === 'dark' || m === true || (m !== 'light' && m !== false && prefersDark)
        if (isDark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
